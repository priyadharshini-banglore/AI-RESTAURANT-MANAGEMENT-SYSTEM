    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/images/pizza-round.png" />

    <meta property="og:image" content="/images/pizza_banner.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      .perspective-1000 {
        perspective: 1000px;
      }
      @keyframes float3D {
        0%, 100% {
          transform: translateY(0px) rotateZ(0deg);
        }
        50% {
          transform: translateY(-12px) rotateZ(2deg);
        }
      }
      .animate-float {
        animation: float3D 4s ease-in-out infinite;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-[#F4F6F8] text-[#1C1C1C] antialiased selection:bg-[#E23744] selection:text-white font-sans overflow-x-clip">
