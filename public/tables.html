<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Servant Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--card:#fffdf7;--cream:#fff4dc;--cream-soft:#f0e4cf;--tx:#3a1a0e;--mut:#7a5843;--bd:#3a1a0e;--red:#d6361f;--ok:#059669;--bk:#d97706;--cl:#2563eb;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="force-dark"]){--bg:#f6efe2;--card:#fffdf7;--cream:#fff4dc;--cream-soft:#f0e4cf;--tx:#3a1a0e;--mut:#7a5843;--bd:#3a1a0e}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden;user-select:none}
h1,h2,h3{font-family:'Inter',cursive,sans-serif;letter-spacing:0.5px;color:#3a1a0e}
h1{font-size:17px;margin:0}h2{font-size:14px;margin:0 0 6px;text-transform:uppercase}
header{padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #3a1a0e;background:#fff4dc;box-shadow:0 3px 0 #3a1a0e}
.legend span{font-size:11px;margin-right:8px;color:var(--tx);font-family:'Inter',sans-serif;letter-spacing:0.4px;text-transform:uppercase}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;border:1px solid #3a1a0e}
main{display:grid;grid-template-columns:minmax(500px, 1.4fr) minmax(380px, 1fr);gap:16px;padding:12px 16px 20px;max-width:1650px;margin:auto;align-items:start;transition:transform .2s ease}
@media(max-width:960px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:2.5px solid #3a1a0e;border-radius:24px;padding:14px 16px;box-shadow:4px 4px 0 #3a1a0e}
.vp{position:relative;width:100%;max-width:clamp(440px,58vh,540px);aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:22px;background:#1e1410;border:3px solid #3a1a0e;box-shadow:4px 4px 0 #3a1a0e;transition:max-width .3s ease}
.stage{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.stage img{width:100%;height:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);width:9.6%;min-width:38px;min-height:38px;aspect-ratio:1;border-radius:50%;border:2.5px solid #ffffff;color:#ffffff!important;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .25s ease;font-family:'Inter',sans-serif;font-size:clamp(12px,1.8vw,15px);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:2px 3px 0 #3a1a0e;padding:0;z-index:6;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hs:hover{border-color:#ffffff!important;transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 16px rgba(255,255,255,0.9);z-index:15}
.hs.sel{outline:3.5px solid #ffdd00;outline-offset:3px;transform:translate(-50%,-50%) scale(1.28);box-shadow:0 0 22px rgba(255,221,0,0.95)!important;z-index:25}
.hs.needs_clean{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 10px rgba(59,125,216,0.6)}}
.available{background:var(--ok)}.booked{background:var(--bk)}.needs_clean{background:var(--cl)}
.hs.available{background:linear-gradient(135deg, #10b981, #059669)!important;border:2.5px solid #ffffff!important}
.hs.booked{background:linear-gradient(135deg, #d6361f, #b92c17)!important;border:2.5px solid #ffffff!important}
.hs.needs_clean{background:linear-gradient(135deg, #2563eb, #1d4ed8)!important;border:2.5px solid #ffffff!important}
.pulse-new-order{animation:pulseOrder 1.2s ease-in-out infinite!important;border:3px solid #d6361f!important;background:rgba(214,54,31,0.6)!important;box-shadow:0 0 20px #d6361f!important;z-index:10!important}
@keyframes pulseOrder{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.hs.has-call{border:3px solid #f59e0b!important;background:rgba(245,158,11,0.6)!important;box-shadow:0 0 22px rgba(245,158,11,0.9)!important;color:#fff!important;text-shadow:0 1px 3px #000;animation:pulseCall 1s ease-in-out infinite!important;z-index:9!important}
@keyframes pulseCall{0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0.85)}50%{transform:translate(-50%,-50%) scale(1.35);box-shadow:0 0 0 16px rgba(245,158,11,0)}100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;border:1.5px solid #3a1a0e;box-shadow:1px 1px 0 #3a1a0e}
button{font-family:'Inter',sans-serif;cursor:pointer;border:2px solid #3a1a0e;border-radius:12px;padding:7px 14px;background:#d6361f;color:#fff4dc;font-size:13px;letter-spacing:0.3px;box-shadow:2px 2px 0 #3a1a0e;transition:transform .1s,background .15s}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #3a1a0e}
button.sec{background:#f0e4cf;color:#3a1a0e;border:2px solid #3a1a0e}
button.sec:hover{background:#ffeac2}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px}
.mut{color:var(--mut);font-size:12px}
.reset{margin-bottom:8px}
.phone{border:6px solid #3a1a0e;border-radius:36px;padding:0;background:#fffdf7;width:100%;max-width:320px;height:clamp(450px,63vh,520px);margin:0 auto;overflow:hidden;position:relative;box-shadow:6px 8px 0 #3a1a0e}
.item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1.5px dashed #3a1a0e;font-size:13px}
.qty{display:flex;gap:6px;align-items:center}.qty button{padding:2px 8px}
select,input,textarea{font-family:'Inter',sans-serif;padding:7px 10px;border-radius:12px;border:2px solid #3a1a0e;background:#ffffff;color:#3a1a0e;width:100%;margin:3px 0 8px;font-size:13px;box-shadow:1px 1px 0 rgba(0,0,0,0.05)}
select:focus,input:focus,textarea:focus{outline:none;border-color:#d6361f}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.servant-tabs{display:flex;gap:8px;margin:8px 0 12px;border-bottom:2px dashed #3a1a0e;padding-bottom:10px}
.stab{flex:1;padding:8px 12px;font-size:12px;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;border-radius:14px;background:#f0e4cf;color:#3a1a0e;border:2px solid #3a1a0e;box-shadow:2px 2px 0 #3a1a0e;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.stab.on{background:#d6361f;color:#fff4dc;border-color:#3a1a0e;box-shadow:3px 3px 0 #3a1a0e;transform:translateY(-1px)}
.stab:hover:not(.on){background:#ffeac2}
.scale-btn{padding:4px 9px;font-size:11px;font-family:'Inter',sans-serif;letter-spacing:0.3px;border-radius:10px;background:#f0e4cf;border:1.5px solid #3a1a0e;color:#3a1a0e;cursor:pointer;box-shadow:1px 1px 0 #3a1a0e;transition:all .15s}
.scale-btn.on{background:#d6361f;color:#fff4dc;border-color:#3a1a0e}
.scale-btn:hover{background:#ffeac2}
.desk-scroll{max-height:clamp(440px,62vh,560px);overflow-y:auto;padding-right:4px}
.desk-scroll::-webkit-scrollbar{width:6px}.desk-scroll::-webkit-scrollbar-thumb{background:#d6c7b2;border-radius:4px}
.table-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.tchip{padding:5px 9px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:0.5px;border-radius:12px;background:#fff4dc;border:2px solid #3a1a0e;color:#3a1a0e;box-shadow:2px 2px 0 #3a1a0e;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .15s ease,background .15s ease}
.tchip:hover{background:#ffeac2;transform:translateY(-1px)}
.tchip.sel{background:#d6361f;color:#fff4dc;border-color:#3a1a0e;transform:scale(1.05)}
.tchip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;border:1px solid #3a1a0e}
.tchip .dot.ok{background:var(--ok)}.tchip .dot.bk{background:var(--bk)}.tchip .dot.cl{background:var(--cl)}.tchip .dot.call{background:#f59e0b;animation:pl 0.8s infinite}
.tchip.call-chip{border-color:#3a1a0e;background:#fef08a;color:#854d0e;font-weight:900}
.floor-stats{font-size:11px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
</style></head><body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:12px;background:#d6361f;color:#fff;border:2px solid #3a1a0e;box-shadow:2px 2px 0 #3a1a0e;display:flex;align-items:center;justify-content:center;font-size:18px">🍽️</div>
    <div>
      <h1 style="font-size:16px;margin:0;font-family:'Inter',sans-serif;letter-spacing:0.5px;color:#3a1a0e">RestroAI Table Reservation &amp; Servant Portal</h1>
    </div>
  </div>
</header>
<script>
window.goToRoute = function(hash) {
  try {
    if (window.parent && window.parent.location) {
      window.parent.location.hash = hash;
    } else {
      window.location.hash = hash;
    }
  } catch(e) {
    window.location.href = '/' + hash;
  }
};
window.currentScale = 1.0;
window.setScale = function(s) {
  window.currentScale = s;
  const m = document.getElementById("main-view");
  if (m) {
    if (s === 1.0) {
      m.style.transform = "";
      m.style.transformOrigin = "";
      m.style.marginBottom = "";
    } else {
      m.style.transform = `scale(${s})`;
      m.style.transformOrigin = "top center";
      const h = m.offsetHeight;
      m.style.marginBottom = `${-(h * (1 - s))}px`;
    }
  }
  document.querySelectorAll(".scale-btn").forEach(b => {
    if (b.dataset && b.dataset.scale) {
      b.classList.toggle("on", parseFloat(b.dataset.scale) === s);
    }
  });
  if (typeof sel !== 'undefined' && sel) zoom(sel);
};
window.setFloorSize = function(size) {
  const vp = document.getElementById("vp");
  if (!vp) return;
  document.querySelectorAll("[id^='sz-']").forEach(b => b.classList.remove("on"));
  const btn = document.getElementById("sz-" + size);
  if (btn) btn.classList.add("on");
  if (size === 'std') {
    vp.style.maxWidth = "clamp(440px, 58vh, 520px)";
  } else if (size === 'lg') {
    vp.style.maxWidth = "clamp(500px, 68vh, 600px)";
  } else if (size === 'max') {
    vp.style.maxWidth = "100%";
  }
  if (typeof sel !== 'undefined') zoom(sel);
};
window.autoFitScale = function() {
  const availH = window.innerHeight - 60;
  const m = document.getElementById("main-view");
  if (!m) return;
  m.style.transform = "";
  m.style.marginBottom = "";
  const naturalH = m.scrollHeight || m.offsetHeight || 580;
  if (window.innerHeight < 680 && naturalH > availH) {
    const ratio = Math.max(0.75, Math.min(1.0, (availH / naturalH) * 0.96));
    setScale(Math.round(ratio * 100) / 100);
  } else {
    setScale(1.0);
  }
};
window.setServantTab = function(tab) {
  const i = document.getElementById("info");
  const w = document.getElementById("wsum");
  if (i) i.style.display = (tab === 'info') ? 'block' : 'none';
  if (w) w.style.display = (tab === 'wsum') ? 'block' : 'none';
  const bi = document.getElementById("tb-info");
  const bw = document.getElementById("tb-wsum");
  if (bi) bi.className = "stab" + (tab === 'info' ? " on" : "");
  if (bw) bw.className = "stab" + (tab === 'wsum' ? " on" : "");
};
</script>

const POS={1:[197,192],2:[519,177],3:[834,193],4:[189,429],5:[189,599],6:[531,396],7:[535,638],8:[187,843],9:[383,880],10:[653,880],11:[849,846],12:[845,520]};

function attachFloorplanClick(){
  const stage = $("stage");
  if (!stage || stage._floorTouchBound) return;
  stage._floorTouchBound = true;
  
  const handleFloorTouch = (e) => {
    // If the touch/click is directly on a hotspot button, it is handled by the button's listener
    if (e.target && e.target.closest && e.target.closest('.hs')) return;
    
    const rect = stage.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    
    const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : null));
    const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : null));
    if (clientX === null || clientY === null) return;
    
    // Map click coordinates to the 1024 x 1024 architectural floorplan space
    const clickX = ((clientX - rect.left) / rect.width) * 1024;
    const clickY = ((clientY - rect.top) / rect.height) * 1024;
    
    // Find closest table
    let closest = null;
    let minD = Infinity;
    for (const k in POS) {
      const [tx, ty] = POS[k];
      const d = Math.hypot(clickX - tx, clickY - ty);
      if (d < minD) {
        minD = d;
        closest = +k;
      }
    }
    
    // If clicked within 180px radius of any table center in 1024 space (covers table + chairs!)
    if (closest && minD <= 180) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      pick(closest);
    } else if (sel !== null && minD > 220) {
      // Tapped outside in common floor area -> zoom back out to full floor
      pick(sel);
    }
  };
  
  stage.addEventListener("pointerdown", handleFloorTouch, { passive: false });
  stage.addEventListener("click", handleFloorTouch);
}

function build(){

function playOrderChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
    
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.85);
  } catch (e) {}
}

function playServiceCallChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    [0, 0.14, 0.28].forEach((delay, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(idx === 2 ? 1046.50 : (idx === 1 ? 880 : 783.99), ctx.currentTime + delay);
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.38);
    });
  } catch (e) {}
}

function playPaymentChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    [0, 0.12, 0.24, 0.36].forEach((delay, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(idx === 3 ? 1046.50 : (idx === 2 ? 783.99 : (idx === 1 ? 659.25 : 523.25)), ctx.currentTime + delay);
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.32);
    });
  } catch(e) {}
}

function syncWithLiveOrders(isInitial = false) {
  let hasChanges = false;
  let newlyBookedTable = null;
  let newlyPaidTable = null;

  for (let k = 1; k <= 12; k++) {
    // 1. Check paid bills
    try {
      const paidRaw = localStorage.getItem('restroai_table_' + k + '_paid_bill');
      if (paidRaw) {
        const paidData = JSON.parse(paidRaw);
        if (paidData && paidData.status === 'PAID') {
          if (!T[k]) {
            T[k] = { c: 4, s: 'needs_clean', g: 0, o: [] };
          }
          const wasNotPaid = !T[k].paidBill;
          T[k].paidBill = paidData;
          T[k].s = 'needs_clean';
          if (wasNotPaid) {
            hasChanges = true;
            if (!isInitial) newlyPaidTable = { k, paidData };
          }
        }
      }
    } catch(e) {}

    // 2. Check orders
    try {
      const billRaw = localStorage.getItem('restroai_table_' + k + '_bill');
      if (billRaw) {
        const billItems = JSON.parse(billRaw);
        if (Array.isArray(billItems) && billItems.length > 0) {
          const formattedOrders = billItems.map(item => ({
            n: item.name || 'Dish',
            p: Math.round(Number(item.price) || 0),
            q: Number(item.quantity) || 1
          }));

          if (!T[k]) {
            T[k] = { c: 4, s: 'available', g: 0, o: [] };
          }

          const prevOrdersStr = JSON.stringify(T[k].o);
          const newOrdersStr = JSON.stringify(formattedOrders);
          const wasNotBooked = T[k].s !== 'booked' && !T[k].paidBill;

          if (prevOrdersStr !== newOrdersStr || wasNotBooked) {
            T[k].o = formattedOrders;
            if (!T[k].paidBill) {
              T[k].s = 'booked';
            }
            T[k].g = T[k].g > 0 ? T[k].g : Math.max(2, Math.min(T[k].c, formattedOrders.reduce((sum, o) => sum + o.q, 0)));
            hasChanges = true;
            if (!isInitial && wasNotBooked) {
              newlyBookedTable = k;
            }
          }
        }
      }
    } catch (e) {}

    // 3. Check service calls
    try {
      const callRaw = localStorage.getItem('restroai_table_' + k + '_service_call');
      if (callRaw) {
        const callData = JSON.parse(callRaw);
        if (callData && callData.status !== 'resolved') {
          const isNewCall = !T[k].call || T[k].call.id !== callData.id;
          T[k].call = callData;
          if (isNewCall && !isInitial) {
            playServiceCallChime();
            showServiceCallToast(k, callData);
          }
          hasChanges = true;
        } else if (callData && callData.status === 'resolved' && T[k].call) {
          T[k].call = null;
          hasChanges = true;
        }
      }
    } catch(e) {}
  }

  // 4. Also check /api/state for any orders and service calls submitted via server
  if (typeof fetch === 'function') {
    fetch('/api/state')
      .then(res => res.json())
      .then(data => {
        if (data) {
          let apiChanged = false;
          if (Array.isArray(data.orders)) {
            data.orders.forEach(ord => {
              if (ord.tableId && ord.status !== 'Served') {
                const tk = Number(ord.tableId);
                if (T[tk] && T[tk].s === 'available') {
                  T[tk].s = 'booked';
                  T[tk].g = T[tk].g || 2;
                  if (T[tk].o.length === 0 && Array.isArray(ord.items)) {
                    T[tk].o = ord.items.map(it => {
                      const name = it.notes ? it.notes.split('(')[0].trim() : ('Dish #' + it.menuItemId);
                      const matched = MENU.find(m => m[0] === name);
                      return { n: name, p: matched ? matched[1] : 250, q: it.quantity || 1 };
                    });
                  }
                  apiChanged = true;
                }
              }
            });
          }
          if (Array.isArray(data.serviceCalls)) {
            data.serviceCalls.forEach(sc => {
              if (sc.tableId && sc.status !== 'resolved') {
                const tk = Number(sc.tableId);
                if (T[tk]) {
                  const isNew = !T[tk].call || T[tk].call.id !== sc.id;
                  T[tk].call = sc;
                  try {
                    localStorage.setItem('restroai_table_' + tk + '_service_call', JSON.stringify(sc));
                  } catch(e) {}
                  if (isNew && !isInitial) {
                    playServiceCallChime();
                    showServiceCallToast(tk, sc);
                  }
                  apiChanged = true;
                }
              }
            });
          }
          if (apiChanged) {
            render();
          }
        }
      })
      .catch(() => {});
  }

  if (hasChanges) {
    render();
    if (newlyBookedTable) {
      notifyNewOrder(newlyBookedTable);
    }
    if (newlyPaidTable) {
      playPaymentChime();
      showPaymentToast(newlyPaidTable.k, newlyPaidTable.paidData);
    }
  }
}

  const current = localStorage.getItem('restro_api_key') || localStorage.getItem('restro_gemini_api_key') || '';
  const key = prompt('Enter your Groq API Key (starts with gsk_...) or Google Gemini Key (starts with AIza...):\n\n• Groq free keys: console.groq.com\n• Gemini free keys: aistudio.google.com\n(Leave blank to use the built-in smart AI engine)', current);
  if (key !== null) {
    const trimmed = key.trim();
    if (trimmed) {
      localStorage.setItem('restro_api_key', trimmed);
      localStorage.setItem('restro_gemini_api_key', trimmed);
      fetch('/api/save-api-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: trimmed })
      }).then(r=>r.json()).then(res=>{
        if (res.provider === 'groq') {
          alert('⚡ Groq API Key saved! Live Groq AI Vision is now active.');

          alert('🟢 Gemini API Key saved! Live Gemini 2.5 Flash Vision is now active.');

          alert('✓ Key saved!');
        }
        render();
        wsumR();
      }).catch(()=>{
        render();
        wsumR();
      });

      localStorage.removeItem('restro_api_key');
      localStorage.removeItem('restro_gemini_api_key');
      fetch('/api/save-api-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: '' })
      }).catch(()=>{});
      alert('API key cleared. Using smart RestroAI vision engine.');
      render();
      wsumR();
    }
  }
};

async function checkWaste(k,file){
  if (!k) k = sel || 1;
  const t = T[k] || T[1];
  t.wm = "🤖 RestroAI Vision analyzing photo for wasted vegetables & foods…";
  render();
  wsumR();

  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = async () => {
      try {
        const sc = Math.min(1, 800 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * sc);
        c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL("image/jpeg", 0.85);
        t.wastePhoto = dataUrl;

        const ord = (t.o || []).map(x => x.q + "x " + x.n);
        const userApiKey = localStorage.getItem('restro_api_key') || localStorage.getItem('restro_gemini_api_key') || '';
        const resp = await fetch('/api/analyze-waste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tableId: k,
            imageBase64: dataUrl,
            orderedDishes: ord,
            userApiKey: userApiKey
          })
        });

        const res = await resp.json();
        if (!res.success || !res.analysis) throw new Error(res.error || "Analysis failed");

        t.w = res.analysis;
        t.wm = "✓ Leftover report saved to Database & synced with Executive Dashboard!";

        WL.push({
          t: k,
          items: res.analysis.items || [],
          kg: +res.analysis.total_kg || 0,
          sug: res.analysis.suggestions || []
        });

        try {
          const ch = new BroadcastChannel('restro_orders_sync');
          ch.postMessage({
            type: 'WASTE_REPORT_ADDED',
            report: res.report || {
              id: 'WR-' + Date.now(),
              tableId: k,
              timestamp: new Date().toISOString(),
              totalKg: res.analysis.total_kg || 0.35,
              totalGrams: res.analysis.total_grams || 350,
              summary: res.analysis.summary || 'Leftover waste scan',
              vegetablesWasted: res.analysis.vegetables_wasted || [],
              foodsWasted: res.analysis.foods_wasted || [],
              suggestions: res.analysis.suggestions || [],
              modelUsed: res.analysis.modelUsed || 'Groq Vision',
              imageThumbnail: dataUrl
            },
            timestamp: Date.now()
          });
          ch.close();
        } catch(e) {}

        render();
        wsumR();
      } catch (err) {
        t.wm = "Analysis note: " + (err && err.message || "Please try again.");
        render();
        wsumR();
      }
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function wsumR(){
  const a={};let tot=0;
  WL.forEach(w=>(w.items||[]).forEach(f=>{const g=+f.grams||0;a[f.food]=(a[f.food]||0)+g;tot+=g}));
  const e=Object.entries(a).sort((x,y)=>y[1]-x[1]).slice(0,5);
  const wsumEl = document.getElementById("wsum");
  if (!wsumEl) return;

  let wasteCard = `<div style="background:#fff;border:1.5px solid #e0451f;border-radius:12px;padding:12px;margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <b style="font-size:13px;color:#2b211b">🔍 AI Leftovers &amp; Vegetables Scanner</b>
      <span style="font-size:10px;font-weight:800;background:rgba(224,69,31,0.1);color:#e0451f;padding:2px 6px;border-radius:6px">AI VISION</span>
    </div>
    <div class="mut" style="font-size:11px;margin-bottom:8px">Choose any plate photo to automatically identify wasted vegetables (broccoli, onions, salads) and leftover foods.</div>
    <div style="display:flex;gap:8px">
      <button class="sec" onclick="pickPhoto(sel||1)" style="flex:1;padding:8px;font-size:12px;font-weight:700">📷 Camera Scan</button>
      <button class="sec" onclick="pickGallery(sel||1)" style="flex:1;padding:8px;font-size:12px;font-weight:700">🖼️ Choose photo</button>
    </div>
  </div>`;

  wsumEl.innerHTML = wasteCard + `<h2>♻️ Today’s Food &amp; Vegetable Waste</h2>` + (e.length ? e.map(([n,g],i)=>`<div class="row"><span>${i+1}. ${esc(n)}</span><span>~${Math.round(g)} g</span></div>`).join("")+`<div class="row"><b>Total</b><b>~${(tot/1000).toFixed(2)} kg</b></div><div style="margin-top:8px">💡 <b>${esc(e[0][0])}</b> is wasted the most. Try serving it in a smaller portion or on request.</div>`:`<div class="mut">No waste photos yet. Choose or capture a photo above to analyze leftover vegetables and food.</div>`)+fbHtml()+dlHtml();
}
function simulateCallServant(tableId) {

  };
  if (T[tableId]) {
    T[tableId].call = call;
  }
  try {
    localStorage.setItem('restroai_table_' + tableId + '_service_call', JSON.stringify(call));

      window.orderSyncChannel.postMessage({
        type: 'SERVICE_CALL_REQUEST',
        call: call,
        tableId: +tableId,
        timestamp: Date.now()
      });
    }
    fetch('/api/service-calls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ call })
    }).catch(()=>{});

  playServiceCallChime();

}

w.style.transform=`rotate(${A}deg)`;const k=((Math.round(-A/st))%n+n)%n;
