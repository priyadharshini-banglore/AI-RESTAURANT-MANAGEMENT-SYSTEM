<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --bg: #f6efe2
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #f6efe2
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden
    }

    canvas {
      display: block
    }

    #l {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: grid;
      place-items: center;
      transition: opacity 1s;
      z-index: 2
    }

    #l img {
      width: min(70vw, 240px);
      height: min(70vw, 240px);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 12px 40px rgba(200, 68, 43, 0.35);
      animation: s 2.4s linear infinite
    }

    @keyframes s {
      to {
        transform: rotate(360deg)
      }
    }

    #tt {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(5vh + env(safe-area-inset-top, 0px));
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      font-family: 'Inter', -apple-system, sans-serif;
      text-transform: uppercase;
      text-align: center
    }

    #tt .w {
      transform: rotate(-3deg);
      display: flex;
      flex-direction: column;
      align-items: center
    }

    #tt h2 {
      margin: 0 0 1vh;
      font-weight: 700;
      font-size: min(3.6vw, 6vh);
      letter-spacing: .08em;
      color: #fff4dc;
      background: #d6361f;
      padding: .5vh 2vw;
      border: .3vw solid #3a1a0e;
      box-shadow: .4vw .5vw 0 #3a1a0e;
      display: inline-block
    }

    #tt h1 {
      margin: 0;
      font-weight: 800;
      font-size: min(12vw, 21vh);
      line-height: .95;
      letter-spacing: -0.02em;
      color: #fff4dc;
      -webkit-text-stroke: .45vw #3a1a0e;
      paint-order: stroke fill;
      text-shadow: .5vw .7vw 0 #d6361f, 1vw 1.3vw 0 #3a1a0e
    }

    #tt h1 span {
      display: inline-block
    }

    .btn-cta {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .02em;
      padding: 12px 24px;
      border-radius: 14px;
      border: 3px solid #3a1a0e;
      font-size: clamp(14px, 1.6vw, 19px);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 4px 0 #3a1a0e;
      transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
      cursor: pointer;
      pointer-events: auto;
      user-select: none
    }

    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 4px 6px 0 #3a1a0e
    }

    .btn-cta:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0 #3a1a0e
    }

    .btn-pri {
      background: #d6361f;
      color: #fff4dc
    }

    .btn-pri:hover {
      background: #ea3b21
    }

    .btn-sec {
      background: #fff4dc;
      color: #3a1a0e
    }

    .btn-sec:hover {
      background: #fffaea
    }
  </style>
</head>

<body>
  <div id="l"><img src="/images/pizza.jpg" alt="Loading pizza"></div>
  <div style="position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:10px;pointer-events:auto">
    <button id="skip-btn" onclick="skipShowcase()"
      style="background:rgba(255,244,220,0.92);border:2px solid #3a1a0e;color:#3a1a0e;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:8px 16px;border-radius:9999px;cursor:pointer;box-shadow:2px 3px 0 #3a1a0e;letter-spacing:.02em;text-transform:uppercase">Skip Intro</button>
    <button onclick="openCustomerMenu()"
      style="background:#d6361f;border:2px solid #3a1a0e;color:#fff4dc;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:8px 18px;border-radius:9999px;cursor:pointer;box-shadow:2px 3px 0 #3a1a0e;letter-spacing:.02em;text-transform:uppercase">Order Menu</button>
  </div>
  <div id="tt">
    <div class="w">
      <h2 id="welcome-sub">Welcome to the</h2>
      <h1>Restaurant</h1>
      <div id="landing-actions"
        style="margin-top:2vh;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;opacity:0;transform:translateY(24px);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.275);pointer-events:none">
        <a href="#" class="btn-cta btn-pri" onclick="openCustomerMenu();return false;">Explore Menu & Order</a>
        <a href="#" class="btn-cta btn-sec" onclick="openCallServant();return false;">Call Waiter</a>
        <a href="#" class="btn-cta btn-sec" onclick="openCustomerBill();return false;">View Bill & Pay</a>
        <a href="#" class="btn-cta btn-sec" onclick="openStaffPortal();return false;" style="background:#3a1a0e;color:#ffd45e;border-color:#3a1a0e">Staff</a>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const R = Math.random, T = THREE; let t = 0;
    const ren = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); ren.setPixelRatio(Math.min(devicePixelRatio, 1.25)); ren.shadowMap.enabled = true; ren.shadowMap.type = T.PCFSoftShadowMap; ren.toneMapping = T.NoToneMapping; ren.outputEncoding = T.sRGBEncoding; document.body.appendChild(ren.domElement);
    const sc = new T.Scene(); sc.background = new T.Color(0xf6efe2); sc.fog = new T.Fog(0xf6efe2, 20, 45);

    const key = new T.DirectionalLight(0xfff0dd, .75); key.position.set(-4, 10, 7); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10 }); key.shadow.radius = 5; sc.add(key);
    const rim = new T.DirectionalLight(0xffc27a, .3); rim.position.set(6, 4, -6); sc.add(rim);
    const gr = new T.Mesh(new T.PlaneGeometry(90, 90), new T.ShadowMaterial({ opacity: .2 })); gr.rotation.x = -Math.PI / 2; gr.position.y = -3.4; gr.receiveShadow = true; sc.add(gr);
    const gm = new T.DataTexture(new Uint8Array([150, 215, 255]), 3, 1, T.LuminanceFormat); gm.minFilter = gm.magFilter = T.NearestFilter; gm.generateMipmaps = false; gm.needsUpdate = true;
    const M = c => { const m = new T.MeshToonMaterial({ color: c, gradientMap: gm }); m.color.offsetHSL(0, .18, -.02); return m };
    const OL = new T.MeshBasicMaterial({ color: 0x2b1a12, side: T.BackSide });
    const mesh = (g, m, p = [0, 0, 0], s = [1, 1, 1]) => { const o = new T.Mesh(g, m); o.position.set(...p); o.scale.set(...s); o.castShadow = true; if (!/Tube|Shape/.test(g.type)) { const ol = new T.Mesh(g, OL); ol.scale.setScalar(1.04); o.add(ol) } return o };
    function bump(g, a) { const p = g.attributes.position; for (let i = 0; i < p.count; i++)p.setXYZ(i, p.getX(i) + (R() - .5) * a, p.getY(i) + (R() - .5) * a, p.getZ(i) + (R() - .5) * a); g.computeVertexNormals(); return g }
    const leafG = (() => { const s = new T.Shape(); s.moveTo(0, 0); s.quadraticCurveTo(.4, .35, 0, 1); s.quadraticCurveTo(-.4, .35, 0, 0); const g = new T.ShapeGeometry(s, 6); g.translate(0, -.5, 0); return g })();

    const on = new T.Group();[.9, 1.2, 1.45].forEach(r => on.add(mesh(new T.TorusGeometry(r, .07, 8, 36), M(0xb0508a, .4)).rotateX(1.5708)));
    on.children.forEach(c => c.rotation.x = 1.5708); lay(B, on, 1.65, U(1.65), 3.5);

    const bunTop = new T.Group(); bunTop.add(mesh(new T.SphereGeometry(1.65, 40, 20, 0, 6.283, 0, 1.5708), M(0xc8742a, .45), [0, 0, 0], [1, .8, 1]));

    S.i.add(bowl);
    const plate = new T.Group(); plate.add(mesh(new T.SphereGeometry(1.7, 24, 12), M(0xb3220f, .3), [0, .35, 0], [1, .35, 1]));

    /* ---------- CARTOON FACES ---------- */

      const g = new T.TorusGeometry(s * 1.2, s * .2, 6, 16, Math.PI).rotateZ(Math.PI); if (flat) g.rotateX(-Math.PI / 2); const m = new T.Mesh(g, eyeM); m.position.set(0, sy, sz); p.add(m)
    }

    face(bunTop, .55, 1.43, .5, .28, 1.63, .2, false);
    face(bowl, .85, 1.85, .5, .55, 1.77, .22, false);
    /* ---------- FLOATING INGREDIENTS ---------- */
    const dm = new T.Object3D(), PS = [], FL = [];
    const geos = [new T.SphereGeometry(.07, 6, 5), new T.BoxGeometry(.14, .14, .14), new T.SphereGeometry(.09, 8, 6), new T.BoxGeometry(.1, .05, .08)], pc = [[0xe8c98a, 0xd9a05a], [0xd8321c, 0xb8230f], [0xc0220e, 0xe04a1c], [0xe3b36a, 0xc98a45]];
    geos.forEach((g, k) => { const m = new T.InstancedMesh(g, M(0xffffff, .4), 25); m.castShadow = true; for (let i = 0; i < 25; i++) { m.setColorAt(i, new T.Color(pc[k][i % 2])); PS.push({ m, i, x: (R() - .5) * 24, y: R() * 9, z: -4 + R() * 10, s: .2 + R() * .5, p: R() * 6, rx: R() * 2, ry: R() * 2 }) } sc.add(m) });
    for (let i = 0; i < 10; i++) { const o = leaf(.5 + R() * .4); sc.add(o); FL.push({ o, x: (R() - .5) * 22, y: R() * 9, z: -3 + R() * 9, s: .2 + R() * .4, p: R() * 6 }) }
    /* ---------- LOOP ---------- */
    const mouse = { x: 0, y: 0 }, sm = { x: 0, y: 0 }, st = { z: 17, a: 0, h: 0 };
    addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5 });
    function rs() { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() }
    addEventListener('resize', rs); rs();
    const clock = new T.Clock(), wrap = (v, n) => ((v % n) + n) % n; let first = true;
    ren.setAnimationLoop(() => {
      if (document.hidden) return;
      t = clock.getElapsedTime();
      sm.x += (mouse.x - sm.x) * .04; sm.y += (mouse.y - sm.y) * .04;
      const k = Math.max(1, 1.78 / cam.aspect); cam.position.set(sm.x * 1.6 + Math.sin(st.a) * st.z * k, 2.4 - sm.y * 1 + st.h, Math.cos(st.a) * st.z * k); cam.lookAt(0, -.2, 0);
      [P, B, S].forEach(d => {
        const e = d.e, u = d.i.userData; d.i.position.y = u.y0 - e * u.dy * -1 * -1; d.i.position.y = u.y0 + e * u.dy; d.i.rotation.y = t * .28 + e * .5;
        d.L.forEach(o => { const b = o.userData; o.position.y = b.y + (b.u - b.y) * e + Math.sin(t * 1.3 + b.p) * .07 * e; o.position.x = b.x + b.dx * e; o.position.z = b.z + b.dz * e; o.rotation.y = b.ry + e * b.spin * (1 + .15 * Math.sin(t * .7 + b.p)); o.rotation.x = b.rx + e * b.tilt * Math.sin(t * .5 + b.p) })
        d.extra(e)
      });
      PS.forEach(p => { dm.position.set(p.x + Math.sin(t * p.s + p.p) * .6, wrap(p.y + t * p.s * .3, 9) - 4.2, p.z); dm.rotation.set(t * p.rx, t * p.ry, 0); dm.updateMatrix(); p.m.setMatrixAt(p.i, dm.matrix) });
      sc.children.forEach(c => { if (c.isInstancedMesh) c.instanceMatrix.needsUpdate = true });
      FL.forEach(f => { f.o.position.set(f.x + Math.sin(t * f.s + f.p) * .8, wrap(f.y + t * f.s * .3, 9) - 4.2, f.z); f.o.rotation.set(t * f.s, t * f.s * 1.3 + f.p, t * .4) });
      ren.render(sc, cam);

    /* ---------- TIMELINE ---------- */
    [P, B, S].forEach(d => d.g.position.x = 40);
    const tl = gsap.timeline({ delay: .2 });
    tl.to(st, { z: 14, duration: 4, ease: 'sine.inOut' }, 0);
    const solo = [1.1, .9, .9];
    [P, B, S].forEach((d, k) => {

      tl.fromTo(d.g.position, { x: 22 }, { x: 0, duration: 0.9, ease: 'power3.out' }, a)
