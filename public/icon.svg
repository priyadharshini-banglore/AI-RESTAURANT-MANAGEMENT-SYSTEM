<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0B0F19" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.6" />
  
  <!-- Glowing AI Core Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad)" stroke-width="16" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" fill="#0F172A" />

  <!-- Executive Crown / Fork & Spoon Fusion -->
  <path d="M200 170 L200 310 M312 170 L312 310 M170 200 C170 230 200 240 200 240 M342 200 C342 230 312 240 312 240" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round" fill="none" />
  <path d="M256 160 L280 220 L256 240 L232 220 Z" fill="url(#grad)" filter="url(#glow)" />
  <text x="256" y="375" font-family="monospace" font-size="44" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">RESTRO AI</text>
  <circle cx="256" cy="420" r="8" fill="#10B981" />
</svg>
