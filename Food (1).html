<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
  <style>
    :root {
      --bg: #f6efe2
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #f6efe2
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden
    }

    canvas {
      display: block
    }

    #l {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: grid;
      place-items: center;
      transition: opacity 1s;
      z-index: 2
    }

    #l i {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #e6d3ac;
      border-top-color: #c8442b;
      animation: s 1s linear infinite
    }

    @keyframes s {
      to {
        transform: rotate(360deg)
      }
    }

    #tt {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(5vh + env(safe-area-inset-top, 0px));
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      font-family: 'Lilita One', 'Impact', 'Arial Black', sans-serif;
      text-transform: uppercase;
      text-align: center
    }

    #tt .w {
      transform: rotate(-3deg)
    }

    #tt h2 {
      margin: 0 0 1vh;
      font-weight: 400;
      font-size: min(3.6vw, 6vh);
      letter-spacing: .18em;
      color: #fff4dc;
      background: #d6361f;
      padding: .5vh 2vw;
      border: .3vw solid #3a1a0e;
      box-shadow: .4vw .5vw 0 #3a1a0e;
      display: inline-block
    }

    #tt h1 {
      margin: 0;
      font-weight: 400;
      font-size: min(12vw, 21vh);
      line-height: .95;
      letter-spacing: .02em;
      color: #fff4dc;
      -webkit-text-stroke: .45vw #3a1a0e;
      paint-order: stroke fill;
      text-shadow: .5vw .7vw 0 #d6361f, 1vw 1.3vw 0 #3a1a0e
    }

    #tt h1 span {
      display: inline-block
    }
  </style>
</head>

<body>
  <div id="l"><i></i></div>
  <div id="tt">
    <div class="w">
      <h2>Welcome to the</h2>
      <h1>Restaurant</h1>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    const R = Math.random, T = THREE; let t = 0;

    const gm = new T.DataTexture(new Uint8Array([150, 215, 255]), 3, 1, T.LuminanceFormat); gm.minFilter = gm.magFilter = T.NearestFilter; gm.generateMipmaps = false; gm.needsUpdate = true;

    const S = dish(0, -1.2, -1.2, .2);
    const nm = M(0xf2b53f);
    const tube = (pts, r) => mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), pts.length * 8, r, 5), nm);
    const bowl = mesh(new T.LatheGeometry([[.01, 0], [.9, .02], [1.7, .5], [2.2, 1.3], [2.12, 1.32], [1.62, .58], [.8, .14], [.01, .12]].map(p => new T.Vector2(p[0], p[1])), 48), new T.MeshToonMaterial({ color: 0xfff8ec, gradientMap: gm, side: T.DoubleSide }));
    S.i.add(bowl);
    const plate = new T.Group(); plate.add(mesh(new T.SphereGeometry(1.7, 24, 12), M(0xb3220f, .3), [0, .35, 0], [1, .35, 1]));
    for (let n = 0; n < 30; n++) { const pts = [], a0 = R() * 6.28; for (let j = 0; j < 14; j++) { const a = a0 + j * .6, r = .9 + R() * .9; pts.push(new T.Vector3(Math.cos(a) * r, .55 + R() * .4 + j * .01, Math.sin(a) * r)) } plate.add(tube(pts, .045)) }
    lay(S, plate, .55, .9, .3);
    const spirals = []; for (let i = 0; i < 8; i++) { const pts = []; for (let j = 0; j <= 44; j++) { const u = j / 44, a = u * (4 + i * .3) * 6.28 + i, r = .3 + .13 * (i % 4) + .15 * Math.sin(u * 6.28); pts.push(new T.Vector3(Math.cos(a) * r, u * 3.4, Math.sin(a) * r)) } const s = tube(pts, .05); S.i.add(s); spirals.push(s) }
    S.extra = e => spirals.forEach((s, i) => { s.scale.y = .05 + .95 * e; s.position.y = 1.4 + e * .5; s.rotation.y = e * (1.2 + Math.sin(t * .8 + i)) * 3 });
    for (let k = 0; k < 3; k++) { const o = mesh(bump(new T.SphereGeometry(.45, 16, 12), .05), M(0x6b2e1a, .7), [(k - 1) * .6, 0, (k % 2 - .5) * .6]); lay(S, o, 1.55, 2 + k * 1.3, 4, (k - 1) * .5, 0, 1) }
    for (let k = 0; k < 4; k++) { const o = mesh(new T.SphereGeometry(.2, 14, 10), M(0xd8291a, .15), [Math.cos(k * 1.6) * 1.2, 0, Math.sin(k * 1.6) * 1.2]); lay(S, o, 1.6, 2.5 + R() * 2.2, 3, Math.cos(k * 1.6) * .9, Math.sin(k * 1.6) * .9, 2) }
    for (let k = 0; k < 4; k++) { const o = leaf(.7); o.rotation.x = -1.3; o.position.set(Math.cos(k * 1.5) * .8, 0, Math.sin(k * 1.5) * .8); lay(S, o, 1.7, 2.6 + k * .6, 4, Math.cos(k * 1.5), Math.sin(k * 1.5), 1) }
    /* ---------- CARTOON FACES ---------- */
    const eyeM = new T.MeshBasicMaterial({ color: 0x1b1210 }), wM = new T.MeshBasicMaterial({ color: 0xffffff });
    function face(p, ey, ez, w, sy, sz, s, flat) {
      [-w, w].forEach(x => { const e = new T.Mesh(new T.SphereGeometry(s * .5, 12, 10), wM); e.position.set(x, ey, ez); p.add(e); const q = new T.Mesh(new T.SphereGeometry(s * .28, 10, 8), eyeM); q.position.set(x, ey + (flat ? s * .35 : 0), ez + (flat ? 0 : s * .35)); p.add(q) });
      const g = new T.TorusGeometry(s * 1.2, s * .2, 6, 16, Math.PI).rotateZ(Math.PI); if (flat) g.rotateX(-Math.PI / 2); const m = new T.Mesh(g, eyeM); m.position.set(0, sy, sz); p.add(m)
    }

    face(bunTop, .55, 1.43, .5, .28, 1.63, .2, false);
    face(bowl, .85, 1.85, .5, .55, 1.77, .22, false);
    /* ---------- FLOATING INGREDIENTS ---------- */
    const dm = new T.Object3D(), PS = [], FL = [];
    const geos = [new T.SphereGeometry(.07, 6, 5), new T.BoxGeometry(.14, .14, .14), new T.SphereGeometry(.09, 8, 6), new T.BoxGeometry(.1, .05, .08)], pc = [[0xe8c98a, 0xd9a05a], [0xd8321c, 0xb8230f], [0xc0220e, 0xe04a1c], [0xe3b36a, 0xc98a45]];
    geos.forEach((g, k) => { const m = new T.InstancedMesh(g, M(0xffffff, .4), 70); m.castShadow = true; for (let i = 0; i < 70; i++) { m.setColorAt(i, new T.Color(pc[k][i % 2])); PS.push({ m, i, x: (R() - .5) * 24, y: R() * 9, z: -4 + R() * 10, s: .2 + R() * .5, p: R() * 6, rx: R() * 2, ry: R() * 2 }) } sc.add(m) });
    for (let i = 0; i < 18; i++) { const o = leaf(.5 + R() * .4); sc.add(o); FL.push({ o, x: (R() - .5) * 22, y: R() * 9, z: -3 + R() * 9, s: .2 + R() * .4, p: R() * 6 }) }
    /* ---------- LOOP ---------- */
    const mouse = { x: 0, y: 0 }, sm = { x: 0, y: 0 }, st = { z: 17, a: 0, h: 0 };
    addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5 });
    function rs() { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() }
    addEventListener('resize', rs); rs();
    const clock = new T.Clock(), wrap = (v, n) => ((v % n) + n) % n; let first = true;
    ren.setAnimationLoop(() => {
      t = clock.getElapsedTime();
      sm.x += (mouse.x - sm.x) * .04; sm.y += (mouse.y - sm.y) * .04;
      const k = Math.max(1, 1.78 / cam.aspect); cam.position.set(sm.x * 1.6 + Math.sin(st.a) * st.z * k, 2.4 - sm.y * 1 + st.h, Math.cos(st.a) * st.z * k); cam.lookAt(0, -.2, 0);
      [P, B, S].forEach(d => {
        const e = d.e, u = d.i.userData; d.i.position.y = u.y0 - e * u.dy * -1 * -1; d.i.position.y = u.y0 + e * u.dy; d.i.rotation.y = t * .28 + e * .5;
        d.L.forEach(o => { const b = o.userData; o.position.y = b.y + (b.u - b.y) * e + Math.sin(t * 1.3 + b.p) * .07 * e; o.position.x = b.x + b.dx * e; o.position.z = b.z + b.dz * e; o.rotation.y = b.ry + e * b.spin * (1 + .15 * Math.sin(t * .7 + b.p)); o.rotation.x = b.rx + e * b.tilt * Math.sin(t * .5 + b.p) })
        d.extra(e)
      });
      PS.forEach(p => { dm.position.set(p.x + Math.sin(t * p.s + p.p) * .6, wrap(p.y + t * p.s * .3, 9) - 4.2, p.z); dm.rotation.set(t * p.rx, t * p.ry, 0); dm.updateMatrix(); p.m.setMatrixAt(p.i, dm.matrix) });
      sc.children.forEach(c => { if (c.isInstancedMesh) c.instanceMatrix.needsUpdate = true });
      FL.forEach(f => { f.o.position.set(f.x + Math.sin(t * f.s + f.p) * .8, wrap(f.y + t * f.s * .3, 9) - 4.2, f.z); f.o.rotation.set(t * f.s, t * f.s * 1.3 + f.p, t * .4) });
      ren.render(sc, cam);
      if (first) { first = false; setTimeout(() => { l.style.opacity = 0; setTimeout(() => l.remove(), 1100) }, 300) }
    });
    /* ---------- TIMELINE ---------- */
    [P, B, S].forEach(d => d.g.position.x = 40);
    const tl = gsap.timeline({ delay: .6 });
    tl.to(st, { z: 14, duration: 6, ease: 'sine.inOut' }, 0);
    const solo = [1.1, .9, .9];
    [P, B, S].forEach((d, k) => {
      const a = 2 + k * 9.6; d.g.scale.setScalar(solo[k]);
      tl.fromTo(d.g.position, { x: 22 }, { x: 0, duration: 1.8, ease: 'power3.out' }, a)
        .to(d, { e: 1, duration: 2.8, ease: 'power2.inOut' }, a + 2)
        .to(d, { e: 0, duration: 2.4, ease: 'power2.inOut' }, a + 6.4)
        .to(d.g.position, { x: -22, duration: 1.3, ease: 'power2.in' }, a + 9)
    });
    const F = 30.6;
    tl.set(P.g.scale, { x: 1, y: 1, z: 1 }, F).set(B.g.scale, { x: 1, y: 1, z: 1 }, F).set(S.g.scale, { x: .85, y: .85, z: .85 }, F)
      .fromTo(P.g.position, { x: -22, y: 0 }, { x: -4.8, y: 0, duration: 2.2, ease: 'power3.out', immediateRender: false }, F)
      .fromTo(B.g.position, { x: 0, y: 14 }, { x: 0, y: 0, duration: 2.2, ease: 'power3.out', immediateRender: false }, F)
      .fromTo(S.g.position, { x: 22, y: 0 }, { x: 4.8, y: 0, duration: 2.2, ease: 'power3.out', immediateRender: false }, F)
      .to([P, B, S], { e: .85, duration: 2.4, ease: 'power2.out', stagger: .25 }, F + .3)
      .to([P, B, S], { e: 0, duration: 2.6, ease: 'power3.inOut', stagger: .3 }, F + 3.8)
      .to(st, { z: 12.8, duration: 9, ease: 'sine.inOut' }, F);
    /* ---------- TITLE CARD ---------- */
    const h1 = document.querySelector('#tt h1'), h2 = document.querySelector('#tt h2'), T0 = F + 12.3;
    h1.innerHTML = h1.textContent.split('').map(c => '<span>' + c + '</span>').join('');
    const ls = h1.querySelectorAll('span');
    tl.to(st, { a: .5, h: 1.2, z: 13.5, duration: 9, ease: 'sine.inOut' }, T0)
      .to([P.g.position, B.g.position, S.g.position], { y: -1.4, duration: 1.8, ease: 'power2.inOut' }, T0)
      .call(() => gsap.to([P, B, S], { e: .5, duration: 2.6, yoyo: true, repeat: -1, ease: 'sine.inOut', stagger: .35 }), null, T0 + .2)
      .set('#tt', { opacity: 1 }, T0 + .6)
      .from(h2, { y: -50, opacity: 0, duration: .7, ease: 'back.out(2)' }, T0 + .6)
      .from(ls, { y: '-130%', rotation: () => gsap.utils.random(-40, 40), scale: 2.2, opacity: 0, duration: .8, ease: 'bounce.out', stagger: .07 }, T0 + 1)
      .to(h1, { scale: 1.04, duration: 1.3, yoyo: true, repeat: -1, ease: 'sine.inOut' }, T0 + 2.4);
  </script>
